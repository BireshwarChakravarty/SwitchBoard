<svg xmlns="http://www.w3.org/2000/svg" width="824" height="824" viewBox="100 100 824 824">
  <!-- The iPhone Home Screen icon: AppIcon.svg cropped to its tile, square
       and full-bleed, because iOS applies its own mask. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F6F2"/>
      <stop offset="1" stop-color="#E4E2DC"/>
    </linearGradient>
    <linearGradient id="on" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB847"/>
      <stop offset="1" stop-color="#F09A14"/>
    </linearGradient>
    <linearGradient id="off" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B3C43"/>
      <stop offset="1" stop-color="#2C2D33"/>
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2A2416" flood-opacity="0.22"/>
    </filter>
    <clipPath id="screen"><rect x="280" y="312" width="464" height="308" rx="18"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" fill="url(#tile)"/>

  <g filter="url(#lift)">
    <rect x="478" y="652" width="68" height="72" fill="#1C1D21"/>
    <rect x="372" y="712" width="280" height="40" rx="20" fill="#1C1D21"/>
    <rect x="240" y="272" width="544" height="388" rx="50" fill="#1C1D21"/>
  </g>
  <g clip-path="url(#screen)">
    <rect x="280" y="312" width="232" height="308" fill="url(#on)"/>
    <rect x="512" y="312" width="232" height="308" fill="url(#off)"/>
    <rect x="280" y="312" width="232" height="4" fill="#FFFFFF" opacity="0.35"/>
  </g>
</svg>
