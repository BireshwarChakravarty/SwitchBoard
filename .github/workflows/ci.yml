name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build numbers count commits

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Package
        run: make package

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: Switchboard
          path: dist/Switchboard.zip
          if-no-files-found: error
