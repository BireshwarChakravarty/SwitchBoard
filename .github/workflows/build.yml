name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version (e.g. 1.0.0). Leave empty for a test build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Package app
        run: ./make-app.sh --package

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Switchboard
          path: dist/Switchboard.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.release) }}
        run: |
          # Creates the tag on GitHub at this commit if it doesn't exist yet.
          gh release create "$TAG" dist/Switchboard.zip --target "$GITHUB_SHA" \
            --title "Switchboard ${TAG#v}" --notes-file RELEASE_NOTES.md \
          || gh release upload "$TAG" dist/Switchboard.zip --clobber
