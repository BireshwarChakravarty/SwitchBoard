name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Package app
        run: ./make-app.sh --package

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Switchboard
          path: dist/Switchboard.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Switchboard.zip \
            --title "Switchboard ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md \
          || gh release upload "$GITHUB_REF_NAME" dist/Switchboard.zip --clobber
